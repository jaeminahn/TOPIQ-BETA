services:
  - type: web
    name: unigate-topik-api
    runtime: docker
    branch: production
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    preDeployCommand: node dist/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGINS
        value: https://topiq.unigate.kr
      - key: DATABASE_SSL
        value: require
      - key: TRUST_PROXY
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_AUDIO_BUCKET
        value: topik-listening-audio
      - key: SUPABASE_MEDIA_BUCKET
        value: topik-question-media
      - key: GOOGLE_CLOUD_PROJECT_ID
        sync: false
      - key: GOOGLE_CLOUD_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_TTS_MODEL
        value: gemini-2.5-flash-tts
      - key: GOOGLE_TTS_FEMALE_VOICE
        value: Aoede
      - key: GOOGLE_TTS_MALE_VOICE
        value: Charon
      - key: TTS_WORKER_ENABLED
        value: "true"
      - key: GOOGLE_IMAGE_LOCATION
        value: global
      - key: GOOGLE_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: VISUAL_WORKER_ENABLED
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: no-reply@unigate.kr
      - key: BREVO_SENDER_NAME
        value: UNIGATE
      - key: PUBLIC_APP_URL
        value: https://topiq.unigate.kr
